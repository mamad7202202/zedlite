[package]
name = "zedlite"
version = "0.2.0"
edition = "2021"
description = "A Zed-inspired AI code editor built with GPUI, powered by the Dragon Agent core"
license = "Apache-2.0"

[dependencies]
gpui = "0.2.2"

# --- Dragon Agent core (ported from mamad7202202/dragon-agent) ---
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "process", "time"] }
futures = "0.3"
bytes = "1"
async-trait = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
